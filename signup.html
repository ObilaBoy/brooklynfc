<h1>SIGN<br>UP</h1>
<p>Join Brooklyn FC Family!</p>

<div class="box">
<h2>Create your account</h2>
<input id="name" type="text" placeholder="Your Full Name">
<br>
<input id="user" type="text" placeholder="Choose Username">
<br>
<input id="pass" type="password" placeholder="Choose Password">
<br>
<button onclick="doSignup()">SIGN UP</button>
<p id="msg"></p>
<p><small>Already have account? <a href="login.html">LOGIN HERE</a></small></p>
</div>

<script>
function doSignup(){
  var n = document.getElementById("name").value;
  var u = document.getElementById("user").value;
  var p = document.getElementById("pass").value;
  if(n == "" || u == "" || p == ""){
    document.getElementById("msg").innerHTML = "⚠️ Please fill ALL boxes!";
  } else {
    document.getElementById("msg").innerHTML = "🎉 WELCOME " + n + "! Account created! Now go LOGIN!";
    setTimeout(function(){ window.location.href="login.html"; }, 2000);
  }
}
</script>
